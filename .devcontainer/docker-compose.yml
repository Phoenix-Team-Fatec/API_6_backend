name: api6-dev-container

services:
  app:
    container_name: api6-java
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspaces/${localWorkspaceFolderBasename}
    volumes:
      - ../..:/workspaces/${localWorkspaceFolderBasename}:cached
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sleep infinity
    depends_on:
      mongo:
        condition: service_healthy
      ml:
        condition: service_healthy
    networks:
      - app-network

  ml:
    container_name: api6-ml
    build:
      context: ../../API_6_ML
      dockerfile: Dockerfile
    working_dir: /app
    env_file:
      - ../../API_6_ML/.env
    environment:
      OLLAMA_HOST: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../API_6_ML/scripts:/app/scripts:cached
      - ../../API_6_ML/src:/app/src:cached
      - ../../API_6_ML/vector_db:/app/vector_db
    command: uvicorn scripts.main_api:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - app-network

  mongo:
    image: mongo:8
    container_name: api6-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: phoenix
      MONGO_INITDB_ROOT_PASSWORD: phoenix
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongo-data:

networks:
  app-network:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1350"
